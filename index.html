            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',

                        neonTeal: '#00f5d4'
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(0, 242, 254, 0.25)',
                        'neon-lg': '0 0 35px rgba(0, 242, 254, 0.4)'
                    }

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.15);
        }
        .glow-border:hover {
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }

        /* Chess Board Large Grid Styling */
        .chess-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 560px;
            aspect-ratio: 1 / 1;
            border-radius: 1.25rem;
            overflow: hidden;
            border: 3px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
        }
        .chess-square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
            position: relative;
        }
        .chess-square:hover { opacity: 0.9; transform: scale(0.97); }
        .chess-square.selected { outline: 4px solid #00f2fe; z-index: 20; box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.6); }
        .chess-square.valid-move::after {
            content: '';
            width: 16px;
            height: 16px;
            background-color: rgba(0, 245, 212, 0.75);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #00f5d4;
        }

        /* Themes */
        .theme-neon .sq-white { background-color: #1e293b; color: #00f2fe; text-shadow: 0 0 8px rgba(0, 242, 254, 0.6); }
        .theme-neon .sq-black { background-color: #0f172a; color: #f43f5e; text-shadow: 0 0 8px rgba(244, 63, 94, 0.6); }

        .theme-wood .sq-white { background-color: #f0d9b5; color: #fff; text-shadow: 1px 1px 2px #000; }
        .theme-wood .sq-black { background-color: #b58863; color: #000; }

        .theme-emerald .sq-white { background-color: #e2e8f0; color: #0284c7; }
        .theme-emerald .sq-black { background-color: #059669; color: #ffffff; }

        .theme-purple .sq-white { background-color: #334155; color: #a855f7; text-shadow: 0 0 8px rgba(168, 85, 247, 0.6); }
        .theme-purple .sq-black { background-color: #1e1b4b; color: #f43f5e; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <header class="sticky top-0 z-50 glass-card border-b border-cyan-500/20">

            <nav class="hidden md:flex items-center space-x-5 text-sm font-semibold">

                <div id="auth-user-section" class="flex items-center gap-3"></div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-slate-300 p-2.5 rounded-xl bg-slate-800 border border-slate-700"><i class="fa-solid fa-bars text-xl" id="menu-icon"></i></button>

            <button onclick="router.navigate('subjects'); toggleMobileMenu();" class="block w-full text-left py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-medium"><i class="fa-solid fa-book-open mr-2"></i> Môn Học</button>
            <button onclick="router.navigate('chess'); toggleMobileMenu();" class="block w-full text-left py-2.5 px-3 rounded-xl hover:bg-slate-800 text-amber-400 font-medium"><i class="fa-solid fa-gamepad mr-2"></i> Giải Trí (Cờ Vua)</button>

    <!-- Modal Thông Báo -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass-card max-w-md w-full p-6 rounded-3xl border border-cyan-500/40 shadow-neon-lg text-center">
            <div id="modal-icon" class="w-16 h-16 rounded-full bg-cyan-500/20 text-cyan-400 mx-auto flex items-center justify-center text-2xl mb-4 shadow-neon"><i class="fa-solid fa-check"></i></div>
            <h3 id="modal-title" class="text-xl font-bold text-white mb-2">Thông Báo</h3>
            <p id="modal-message" class="text-slate-300 text-sm mb-6 leading-relaxed">Nội dung...</p>
            <div id="modal-action-btn-container"><button onclick="closeModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon">Đã Hiểu</button></div>
        </div>
    </div>

    <!-- Modal Đăng Nhập -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 backdrop-blur-sm p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-3xl border border-cyan-500/40 shadow-neon-lg relative">
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-cyan-500/20 text-cyan-400 mx-auto flex items-center justify-center text-2xl mb-3 shadow-neon"><i class="fa-solid fa-user-lock"></i></div>
                <h3 id="auth-modal-title" class="text-2xl font-bold text-white">Đăng Nhập Tài Khoản</h3>
            </div>
            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div><label class="block text-xs font-semibold text-slate-300 mb-1.5">Tên đăng nhập hoặc Email</label><input type="text" id="auth-username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200"></div>
                <div><label class="block text-xs font-semibold text-slate-300 mb-1.5">Mật khẩu</label><input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200"></div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon">Đăng Nhập Ngay</button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400"><span id="auth-switch-text">Chưa có tài khoản?</span><button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-cyan-400 font-bold ml-1 hover:underline">Tạo mới</button></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAj10AebiGGR0t8YPy-17eZUkpPYHRUSnc",
            authDomain: "eduspace-5e6e1.firebaseapp.com",
            projectId: "eduspace-5e6e1",
            storageBucket: "eduspace-5e6e1.firebasestorage.app",
            messagingSenderId: "767177867816",
            appId: "1:767177867816:web:580a27d186469fab016b1d",
            measurementId: "G-C0M29EKV4B"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultAppData = {
            math: {
                id: 'math', name: 'Toán Học', color: 'from-cyan-500 to-blue-600', icon: 'fa-square-root-variable', badgeBg: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30', description: 'Khám phá đại số, hàm số, hình học không gian.',
                units: [{
                    id: 'm_u1', title: 'Unit 1: Đại Số & Khảo Sát Hàm Số',
                    lessons: [
                        { id: 'm_l1', title: 'Lesson 1: Sự Đồng Biến và Nghịch Biến', theory: 'Cho hàm số $y = f(x)$ xác định trên khoảng $K$.', exercises: [{ question: 'Cho hàm số $y = x^3 - 3x$. Đồng biến trên khoảng nào?', options: ['$(-\\infty; -1)$ và $(1; +\\infty)$', '$(-1; 1)$', '$(-\\infty; 0)$', '$(0; +\\infty)$'], correct: 0, explanation: 'Đạo hàm $y\' = 3x^2 - 3$.' }], essays: [{ question: 'Chứng minh hàm số $y = -x^3 + 3x$ nghịch biến trên $(1; +\\infty)$.', sampleAnswer: 'Lập bảng biến thiên đạo hàm suy ra đpcm.' }] },
                        { id: 'm_l2', title: 'Lesson 2: Cực Trị Của Hàm Số', theory: 'Điểm cực trị thỏa mãn $f\'(x_0) = 0$.', exercises: [{ question: 'Hàm số $y = x^4 - 2x^2$ có mấy cực trị?', options: ['3', '1', '2', '0'], correct: 0, explanation: 'Có 3 nghiệm đạo hàm.' }] }
                    ]
                }]
            },
            physics: {
                id: 'physics', name: 'Vật Lý', color: 'from-blue-600 to-teal-500', icon: 'fa-atom', badgeBg: 'bg-blue-500/10 text-blue-400 border-blue-500/30', description: 'Chinh phục dao động cơ, điện xoay chiều.',
                units: [{
                    id: 'p_u1', title: 'Unit 1: Dao Động Cơ Học',
                    lessons: [{ id: 'p_l1', title: 'Lesson 1: Phương Trình Dao Động', theory: 'Ly độ $x = A\\cos(\\omega t + \\varphi)$.', exercises: [{ question: 'Biên độ $A$ là gì?', options: ['Li độ cực đại', 'Tần số', 'Chu kỳ', 'Pha'], correct: 0, explanation: 'Biên độ $A$ là li độ cực đại.' }] }]
                }]
            },
            english: {
                id: 'english', name: 'Tiếng Anh', color: 'from-teal-500 to-cyan-600', icon: 'fa-language', badgeBg: 'bg-teal-500/10 text-teal-400 border-teal-500/30', description: 'Thành thạo ngữ pháp nâng cao, từ vựng.',
                units: [{
                    id: 'e_u1', title: 'Unit 1: Advanced English Grammar',
                    lessons: [{ id: 'e_l1', title: 'Lesson 1: Present Perfect', theory: 'Present Perfect: S + have/has + V3.', exercises: [{ question: 'I _____ to Tokyo twice.', options: ['have been', 'was', 'go', 'had'], correct: 0, explanation: 'Thì hiện tại hoàn thành.' }] }]
                }]
            }
        };

        let currentAuthUser = 'hoangphihung2k11@gmail.com';
        let isRegisterMode = false;
        let globalData = defaultAppData;
        let globalUsers = { 'hoangphihung2k11_gmail_com': { password: '123', name: 'Hoàng Phi Hùng (Admin)' } };
        let globalProgress = {};
        
        // Chess Engine & Multiplayer State
        let chessGame = new Chess();
        let activeGameId = null;
        let myColor = 'w'; // 'w' cho Trắng, 'b' cho Đen
        let selectedSquare = null;
        let validMoves = [];
        let currentBoardTheme = 'theme-neon';

        const chessPiecesMap = {
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟',
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙'
        };

        function cleanKey(str) { return str.replace(/[\.\#\$\[\]]/g, "_"); }

        function initFirebaseListeners() {
            db.ref('eduspace_data').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) globalData = val; else db.ref('eduspace_data').set(defaultAppData);
                render();
            });

            db.ref('eduspace_users').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    globalUsers = val;
                    if (router.currentView === 'chess') renderUserDropdown();
                } else {
                    db.ref('eduspace_users').set(globalUsers);
                }
            });

            db.ref('eduspace_progress').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) globalProgress = val;
            });

            const savedUser = localStorage.getItem('eduspace_current_user');
            if (savedUser) currentAuthUser = savedUser;

            const cleanUser = cleanKey(currentAuthUser);
            db.ref(`eduspace_invites/${cleanUser}`).on('value', (snapshot) => {
                renderMailbox(snapshot.val());
            });
        }

        function saveAppData(data) { db.ref('eduspace_data').set(data); }
        function getProgressData() { const cleanUser = cleanKey(currentAuthUser); return globalProgress[cleanUser] || {}; }
        function saveProgressData(prog) { const cleanUser = cleanKey(currentAuthUser); db.ref('eduspace_progress/' + cleanUser).set(prog); }

        function renderAllMath() {
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false });
            }
        }

        function renderAuthNavbar() {
            const container = document.getElementById('auth-user-section');
            if (!container) return;
            if (currentAuthUser && currentAuthUser !== 'Khách') {
                container.innerHTML = `
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-slate-800/90 border border-cyan-500/30">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-neon">${currentAuthUser.charAt(0).toUpperCase()}</div>
                        <div class="hidden sm:block text-left"><div class="text-xs font-bold text-white truncate max-w-[100px]">${currentAuthUser}</div></div>
                        <button onclick="handleLogout()" title="Đăng xuất" class="ml-1 text-slate-400 hover:text-rose-400 p-1"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>`;
            } else {
                container.innerHTML = `<button onclick="openAuthModal()" class="px-3 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs shadow-neon"><i class="fa-solid fa-user"></i> Đăng Nhập</button>`;
            }
        }

        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); document.getElementById('auth-modal').classList.add('flex'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.remove('flex'); document.getElementById('auth-modal').classList.add('hidden'); }
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-modal-title').innerText = isRegisterMode ? "Tạo Tài Khoản Mới" : "Đăng Nhập Tài Khoản";
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "Đăng Ký Tài Khoản" : "Đăng Nhập Ngay";
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const cleanUserKey = cleanKey(username);

            if (isRegisterMode) {
                if (globalUsers[cleanUserKey]) { showModal("Lỗi", "Tài khoản đã tồn tại!", false); return; }
                db.ref('eduspace_users/' + cleanUserKey).set({ password, name: username });
                showModal("Thành Công", "Đăng ký thành công!", true);
            } else {
                if (!globalUsers[cleanUserKey] || globalUsers[cleanUserKey].password !== password) { showModal("Lỗi", "Sai tài khoản hoặc mật khẩu!", false); return; }
                showModal("Thành Công", `Chào mừng ${username}!`, true);
            }
            localStorage.setItem('eduspace_current_user', username);
            currentAuthUser = username;
            renderAuthNavbar(); closeAuthModal(); render();
        }

        function handleLogout() {
            localStorage.setItem('eduspace_current_user', 'Khách'); currentAuthUser = 'Khách';
            renderAuthNavbar(); showModal("Đã Đăng Xuất", "Đã thoát tài khoản.", true); render();
        }

        function toggleMailbox() { document.getElementById('mailbox-dropdown').classList.toggle('hidden'); }

        function renderMailbox(invitesObj = null) {
            const listContainer = document.getElementById('mailbox-list');
            const badge = document.getElementById('mail-badge');
            if (!invitesObj) {
                listContainer.innerHTML = `<p class="text-slate-400 italic text-center py-2">Không có lời mời nào.</p>`;
                badge.classList.add('hidden');
                return;
            }

            const entries = Object.entries(invitesObj);
            badge.innerText = entries.length;
            if (entries.length > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');

            listContainer.innerHTML = entries.map(([key, item]) => `
                <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                    <p class="text-slate-200"><strong>${item.from}</strong> mời bạn thách đấu Cờ Vua!</p>
                    <div class="flex gap-2">
                        <button onclick="acceptInvite('${key}', '${item.gameId}', '${item.from}')" class="flex-1 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold hover:bg-emerald-500 hover:text-white transition">Đồng ý</button>
                        <button onclick="declineInvite('${key}')" class="flex-1 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-bold hover:bg-rose-500 hover:text-white transition">Từ chối</button>
                    </div>
                </div>
            `).join('');
        }

        function sendGameInvite(targetUser) {
            if (currentAuthUser === 'Khách') { showModal("Lỗi", "Vui lòng đăng nhập để mời đấu!", false); return; }
            if (!targetUser || targetUser === currentAuthUser) { showModal("Lỗi", "Vui lòng chọn bạn bè hợp lệ!", false); return; }
            
            const gameId = 'game_' + Date.now();
            const cleanTarget = cleanKey(targetUser);

            chessGame.reset();
            db.ref(`eduspace_chess_games/${gameId}`).set({
                white: currentAuthUser,
                black: targetUser,
                fen: chessGame.fen(),
                status: 'active'
            });

            db.ref(`eduspace_invites/${cleanTarget}/${gameId}`).set({
                from: currentAuthUser,
                gameId: gameId,
                timestamp: Date.now()
            });

            showModal("Thành Công", `Đã gửi lời mời thách đấu Cờ Vua đến ${targetUser}!`, true);
            router.navigate('chess', { gameId: gameId, opponent: targetUser, color: 'w' });
        }

        function acceptInvite(inviteKey, gameId, opponent) {
            const cleanUser = cleanKey(currentAuthUser);
            db.ref(`eduspace_invites/${cleanUser}/${inviteKey}`).remove();
            toggleMailbox();
            router.navigate('chess', { gameId: gameId, opponent: opponent, color: 'b' });
        }

        function declineInvite(inviteKey) {
            const cleanUser = cleanKey(currentAuthUser);
            db.ref(`eduspace_invites/${cleanUser}/${inviteKey}`).remove();
        }

        let router = {
            currentView: 'home', params: {},
            navigate: function(view, params = {}) {
                this.currentView = view; this.params = params;
                window.scrollTo({ top: 0, behavior: 'smooth' }); render(); updateActiveNav(view);
            }
        };

        function updateActiveNav(view) {
            document.querySelectorAll('.nav-link').forEach(el => { el.classList.remove('text-cyan-400'); el.classList.add('text-slate-300'); });
            const active = document.getElementById(`nav-${view}`);
            if(active) { active.classList.remove('text-slate-300'); active.classList.add('text-cyan-400'); }
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

        function showModal(title, message, isSuccess = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }
        function closeModal() { document.getElementById('custom-modal').classList.remove('flex'); document.getElementById('custom-modal').classList.add('hidden'); }

        function render() {
            const container = document.getElementById('app-content');
            const data = globalData;
            renderAuthNavbar();
            if (router.currentView === 'home') container.innerHTML = renderHome(data);
            else if (router.currentView === 'subjects') container.innerHTML = renderSubjects(data);
            else if (router.currentView === 'subject') container.innerHTML = renderSubjectDetail(data, router.params.subjectId);
            else if (router.currentView === 'lesson') container.innerHTML = renderLessonDetail(data, router.params.subjectId, router.params.unitId, router.params.lessonId);
            else if (router.currentView === 'upload') container.innerHTML = renderUploadPortal(data);
            else if (router.currentView === 'contact') container.innerHTML = renderContact();
            else if (router.currentView === 'chess') container.innerHTML = renderChessSection();
            else container.innerHTML = renderHome(data);
            
            if (router.currentView === 'chess') initCustomChessBoard();
            setTimeout(renderAllMath, 50);
        }

        function renderHome(data) {
            const progress = getProgressData();
            let total = 0, completed = 0;
            Object.values(data).forEach(sub => { if(sub.units) sub.units.forEach(u => { if(u.lessons) { total += u.lessons.length; u.lessons.forEach(l => { if(progress[l.id]) completed++; }); } }); });
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            return `
                <div class="space-y-12 animate-fadeIn">
                    <div class="relative overflow-hidden rounded-3xl glass-card p-8 sm:p-12 border border-cyan-500/30 shadow-neon bg-gradient-to-r from-slate-900/95 via-cardBg/90 to-slate-900/95">
                        <div class="relative z-10 max-w-2xl space-y-6">
                            <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs font-semibold shadow-neon">Tài khoản Cloud: <strong class="text-white">${currentAuthUser}</strong></span>
                            <h2 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight">Chinh Phục Kiến Thức <span class="bg-gradient-to-r from-cyan-400 via-blue-400 to-teal-300 bg-clip-text text-transparent">Toán, Lý & Anh</span></h2>
                            <p class="text-slate-300 text-base sm:text-lg">Hệ thống bài giảng chuẩn hóa, trắc nghiệm tương tác và bài tập tự luận chi tiết.</p>
                            <div class="flex flex-wrap gap-4">
                                <button onclick="router.navigate('subjects')" class="px-7 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon-lg flex items-center gap-2"><i class="fa-solid fa-rocket"></i> Khám Phá Bài Học</button>
                                <button onclick="router.navigate('chess')" class="px-7 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold shadow-neon-lg flex items-center gap-2"><i class="fa-solid fa-gamepad"></i> Giải Trí Cờ Vua</button>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl p-6 sm:p-8 border border-cyan-500/20 flex flex-col md:flex-row items-center justify-between gap-6">
                        <div class="flex items-center space-x-4">
                            <div class="w-16 h-16 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl shadow-neon shrink-0"><i class="fa-solid fa-chart-line"></i></div>
                            <div><h3 class="text-xl font-bold text-white">Tiến Độ: <span class="text-cyan-400">${currentAuthUser}</span></h3><p class="text-slate-400 text-sm">Đã hoàn thành <span class="text-cyan-400 font-bold">${completed}</span> / <span class="text-white font-bold">${total}</span> bài học.</p></div>
                        </div>
                        <div class="w-full md:w-64 space-y-2">
                            <div class="flex justify-between text-xs font-bold"><span class="text-slate-300">Hoàn thành</span><span class="text-cyan-400">${percent}%</span></div>
                            <div class="w-full h-3 rounded-full bg-slate-800 overflow-hidden p-0.5 border border-slate-700"><div class="h-full rounded-full bg-gradient-to-r from-cyan-500 to-teal-400" style="width: ${percent}%"></div></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${Object.values(data).map(sub => `
                            <div onclick="router.navigate('subject', {subjectId: '${sub.id}'})" class="glass-card p-6 sm:p-8 rounded-3xl glow-border cursor-pointer group">
                                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr ${sub.color} flex items-center justify-center text-2xl text-white shadow-neon mb-6"><i class="fa-solid ${sub.icon}"></i></div>
                                <h4 class="text-xl font-bold text-white mb-2 group-hover:text-cyan-400">${sub.name}</h4>
                                <p class="text-slate-400 text-sm">${sub.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        function renderSubjects(data) {
            return `
                <div class="space-y-8 animate-fadeIn">
                    <h2 class="text-3xl font-extrabold text-white">Chương Trình Học Toán, Lý, Anh</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${Object.values(data).map(sub => `
                            <div onclick="router.navigate('subject', {subjectId: '${sub.id}'})" class="glass-card p-6 sm:p-8 rounded-3xl glow-border cursor-pointer">
                                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr ${sub.color} flex items-center justify-center text-2xl text-white shadow-neon mb-6"><i class="fa-solid ${sub.icon}"></i></div>
                                <h4 class="text-xl font-bold text-white mb-2">${sub.name}</h4>
                                <p class="text-slate-400 text-sm">${sub.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        function renderSubjectDetail(data, subjectId) {
            const sub = data[subjectId];
            if(!sub) return `<div class="text-center py-20 text-slate-400">Không tìm thấy môn học!</div>`;
            const progress = getProgressData();
            const units = sub.units || [];
            return `
                <div class="space-y-8 animate-fadeIn">
                    <div class="glass-card p-8 sm:p-10 rounded-3xl border border-cyan-500/30 shadow-neon flex items-center space-x-6">
                        <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr ${sub.color} flex items-center justify-center text-3xl text-white shadow-neon"><i class="fa-solid ${sub.icon}"></i></div>
                        <div><h2 class="text-3xl font-extrabold text-white">${sub.name}</h2><p class="text-slate-300 text-sm mt-1">${sub.description}</p></div>
                    </div>
                    <div class="space-y-6">
                        <h3 class="text-xl font-bold text-white">Danh Sách Units & Bài Học</h3>
                        <div class="space-y-4">
                            ${units.map((unit) => `
                                <div class="glass-card rounded-3xl border border-slate-800 overflow-hidden">
                                    <div class="bg-slate-800/60 px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                                        <h4 class="font-bold text-lg text-cyan-300">${unit.title}</h4>
                                    </div>
                                    <div class="divide-y divide-slate-800/60">
                                        ${(!unit.lessons || unit.lessons.length === 0) ? `<div class="p-4 text-xs text-slate-400 italic">Chưa có bài học nào.</div>` : ''}
                                        ${(unit.lessons || []).map((lesson, lIdx) => {
                                            const isDone = progress[lesson.id];
                                            return `
                                                <div class="p-5 hover:bg-slate-800/50 transition flex items-center justify-between group">
                                                    <div onclick="router.navigate('lesson', {subjectId: '${sub.id}', unitId: '${unit.id}', lessonId: '${lesson.id}'})" class="flex items-center space-x-4 cursor-pointer flex-grow">
                                                        <div class="w-10 h-10 rounded-xl ${isDone ? 'bg-emerald-500/20 text-emerald-400 border' : 'bg-slate-800 text-slate-300'} flex items-center justify-center font-bold text-sm">${isDone ? '<i class="fa-solid fa-check"></i>' : (lIdx + 1)}</div>
                                                        <h5 class="font-semibold text-white group-hover:text-cyan-300">${lesson.title}</h5>
                                                    </div>
                                                </div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderLessonDetail(data, subjectId, unitId, lessonId) {
            const sub = data[subjectId];
            const unit = sub.units.find(u => u.id === unitId);
            const lesson = unit.lessons.find(l => l.id === lessonId);
            if (!lesson) return `<div class="text-center py-20 text-slate-400">Không tìm thấy bài học!</div>`;
            const exercises = lesson.exercises || [];
            const essays = lesson.essays || [];
            return `
                <div class="space-y-8 max-w-4xl mx-auto animate-fadeIn">
                    <button onclick="router.navigate('subject', {subjectId: '${sub.id}'})" class="px-4 py-2 rounded-xl bg-slate-800 text-cyan-400 text-xs font-bold border border-slate-700 hover:bg-slate-700 transition flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Quay Lại Danh Sách Unit</button>
                    <div class="glass-card p-6 sm:p-8 rounded-3xl border border-cyan-500/30 shadow-neon">
                        <span class="px-3.5 py-1 rounded-full text-xs font-semibold ${sub.badgeBg} mb-3 inline-block">${unit.title}</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1 mb-3">${lesson.title}</h2>
                    </div>
                    <div class="flex border-b border-slate-800 space-x-6 overflow-x-auto">
                        <button onclick="switchLessonTab('theory')" id="tab-btn-theory" class="pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 text-base whitespace-nowrap"><i class="fa-solid fa-book-open"></i> Lý Thuyết</button>
                        <button onclick="switchLessonTab('quiz')" id="tab-btn-quiz" class="pb-3 font-semibold text-slate-400 hover:text-white text-base whitespace-nowrap"><i class="fa-solid fa-pen-to-square"></i> Trắc Nghiệm (${exercises.length})</button>
                        <button onclick="switchLessonTab('essay')" id="tab-btn-essay" class="pb-3 font-semibold text-slate-400 hover:text-white text-base whitespace-nowrap"><i class="fa-solid fa-pen-nib"></i> Bài Tập Tự Luận (${essays.length})</button>
                    </div>

                    <div id="lesson-tab-theory" class="glass-card p-6 sm:p-10 rounded-3xl border border-slate-800 space-y-6 text-slate-200"><div class="prose prose-invert max-w-none space-y-4">${lesson.theory}</div></div>
                    
                    <div id="lesson-tab-quiz" class="glass-card p-6 sm:p-10 rounded-3xl border border-slate-800 space-y-8 hidden">
                        <div class="space-y-8">
                            ${exercises.map((ex, exIdx) => `
                                <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-4">
                                    <h4 class="font-bold text-white text-base">Câu ${exIdx+1}:${ex.question}</h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${(ex.options || []).map((opt, optIdx) => `
                                            <label class="flex items-center space-x-3 p-3.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 cursor-pointer text-sm text-slate-200">
                                                <input type="radio" name="question_${exIdx}" value="${optIdx}" class="text-cyan-500 h-4 w-4 bg-slate-900">
                                                <span>${opt}</span>
                                            </label>`).join('')}
                                    </div>
                                    <div id="feedback_${exIdx}" class="hidden p-4 rounded-xl text-xs font-semibold"></div>
                                    <div id="explanation_${exIdx}" class="hidden pl-4 pt-3 text-xs text-slate-300 italic bg-cyan-500/5 p-4 rounded-xl border border-cyan-500/20"><strong class="text-cyan-300">Giải thích:</strong> ${ex.explanation}</div>
                                </div>`).join('')}
                            <div class="flex flex-wrap gap-4 justify-end pt-4" id="quiz-action-buttons">
                                <button onclick="submitLessonQuiz('${sub.id}', '${lesson.id}', ${exercises.length})" id="submit-quiz-btn" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon-lg">Nộp Bài</button>
                            </div>
                        </div>
                    </div>

                    <div id="lesson-tab-essay" class="glass-card p-6 sm:p-10 rounded-3xl border border-slate-800 space-y-8 hidden">
                        <div class="space-y-8">
                            ${essays.length === 0 ? `<p class="text-slate-400 text-sm italic">Chưa có bài tập tự luận nào cho bài học này.</p>` : ''}
                            ${essays.map((essay, eIdx) => `
                                <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-4">
                                    <h4 class="font-bold text-white text-base">Bài tự luận ${eIdx+1}:${essay.question}</h4>
                                    <textarea rows="4" placeholder="Nhập bài giải tự luận của bạn tại đây..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 focus:border-cyan-400 outline-none"></textarea>
                                    <button onclick="toggleEssaySample(${eIdx})" class="px-4 py-2 rounded-xl bg-slate-800 text-cyan-400 text-xs font-bold border border-cyan-500/30 hover:bg-slate-700 transition"><i class="fa-solid fa-lightbulb mr-1"></i> Xem Gợi Ý / Lời Giải Mẫu</button>
                                    <div id="essay-sample-${eIdx}" class="hidden p-4 rounded-xl bg-cyan-500/5 border border-cyan-500/20 text-xs text-slate-300 space-y-2">
                                        <strong class="text-cyan-300">Lời giải mẫu:</strong><p>${essay.sampleAnswer}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function switchLessonTab(tab) {
            const theoryDiv = document.getElementById('lesson-tab-theory');
            const quizDiv = document.getElementById('lesson-tab-quiz');
            const essayDiv = document.getElementById('lesson-tab-essay');
            const btnTheory = document.getElementById('tab-btn-theory');
            const btnQuiz = document.getElementById('tab-btn-quiz');
            const btnEssay = document.getElementById('tab-btn-essay');

            theoryDiv.classList.add('hidden'); quizDiv.classList.add('hidden'); essayDiv.classList.add('hidden');
            btnTheory.className = "pb-3 font-semibold text-slate-400 hover:text-white text-base whitespace-nowrap";
            btnQuiz.className = "pb-3 font-semibold text-slate-400 hover:text-white text-base whitespace-nowrap";
            btnEssay.className = "pb-3 font-semibold text-slate-400 hover:text-white text-base whitespace-nowrap";

            if (tab === 'theory') {
                theoryDiv.classList.remove('hidden');
                btnTheory.className = "pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 text-base whitespace-nowrap";
            } else if (tab === 'quiz') {
                quizDiv.classList.remove('hidden');
                btnQuiz.className = "pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 text-base whitespace-nowrap";
            } else if (tab === 'essay') {
                essayDiv.classList.remove('hidden');
                btnEssay.className = "pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 text-base whitespace-nowrap";
            }
            setTimeout(renderAllMath, 50);
        }

        function toggleEssaySample(idx) {
            document.getElementById(`essay-sample-${idx}`).classList.toggle('hidden');
            setTimeout(renderAllMath, 50);
        }

        function submitLessonQuiz(subjectId, lessonId, totalQuestions) {
            let score = 0;
            const data = globalData;
            let lessonObj = null;
            Object.values(data).forEach(sub => { if(sub.units) sub.units.forEach(u => { if(u.lessons) u.lessons.forEach(l => { if(l.id === lessonId) lessonObj = l; }); }); });
            
            for (let i = 0; i < totalQuestions; i++) {
                const selected = document.querySelector(`input[name="question_${i}"]:checked`);
                const feedbackDiv = document.getElementById(`feedback_${i}`);
                const expDiv = document.getElementById(`explanation_${i}`);
                
                feedbackDiv.classList.remove('hidden');
                expDiv.classList.remove('hidden');

                const correctIdx = lessonObj.exercises[i].correct;

                if (selected) {
                    if (parseInt(selected.value) === correctIdx) {
                        score++;
                        feedbackDiv.className = "p-4 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                        feedbackDiv.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Chính xác! Bạn chọn đúng đáp án này.`;
                    } else {
                        feedbackDiv.className = "p-4 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30";
                        feedbackDiv.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Sai rồi! Đáp án đúng là: <strong>${lessonObj.exercises[i].options[correctIdx]}</strong>.`;
                    }
                } else {
                    feedbackDiv.className = "p-4 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30";
                    feedbackDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Chưa chọn đáp án!`;
                }
            }

            let progress = getProgressData();
            progress[lessonId] = { score, total: totalQuestions, timestamp: Date.now() };
            saveProgressData(progress);

            document.getElementById('quiz-action-buttons').innerHTML = `
                <button onclick="resetQuizForm(${totalQuestions})" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold shadow-neon-lg flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> Làm Lại Bài Này</button>
                <button onclick="router.navigate('subject', {subjectId: '${subjectId}'})" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon-lg">Hoàn Tất</button>
            `;

            showModal("Kết Quả", `Bạn đúng ${score} / ${totalQuestions} câu!`, score === totalQuestions);
            setTimeout(renderAllMath, 50);
        }

        function resetQuizForm(totalQuestions) {
            for (let i = 0; i < totalQuestions; i++) {
                const radios = document.querySelectorAll(`input[name="question_${i}"]`);
                radios.forEach(r => r.checked = false);
                document.getElementById(`feedback_${i}`).classList.add('hidden');
                document.getElementById(`explanation_${i}`).classList.add('hidden');
            }
            document.getElementById('quiz-action-buttons').innerHTML = `<button onclick="submitLessonQuiz('${router.params.subjectId}', '${router.params.lessonId}', ${totalQuestions})" id="submit-quiz-btn" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon-lg">Nộp Bài</button>`;
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        // MỤC GIẢI TRÍ CỜ VUA CHUẨN MULTIPLAYER ONLINE (KHÓA LƯỢT ĐI DỰA TRÊN MÀU QUÂN)
        function renderChessSection() {
            return `
                <div class="space-y-8 animate-fadeIn">
                    <div class="glass-card p-6 rounded-3xl border border-amber-500/30 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-extrabold text-white flex items-center gap-2"><i class="fa-solid fa-chess-knight text-amber-400"></i> Mục Giải Trí: Cờ Vua Đấu Bạn Bè (Multiplayer)</h2>
                            <p class="text-xs text-slate-400">Khóa nước đi theo màu quân. Đồng bộ Realtime trên Firebase.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <select id="invite-user-select" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200">
                                <option value="">-- Chọn Bạn Bè Để Mời --</option>
                            </select>
                            <button onclick="sendGameInvite(document.getElementById('invite-user-select').value)" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-xs shadow-neon"><i class="fa-solid fa-paper-plane mr-1"></i> Gửi Lời Mời</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                        <div class="lg:col-span-2 glass-card p-6 sm:p-8 rounded-3xl border border-slate-800 flex flex-col items-center">
                            <div class="w-full flex justify-between items-center mb-6 text-sm font-bold">
                                <span class="text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-user"></i> <span id="player-white">Trắng: ---</span></span>
                                <span id="game-status" class="px-4 py-1.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 text-xs font-bold shadow-neon">Lượt chơi: Trắng</span>
                                <span class="text-rose-400 flex items-center gap-2"><i class="fa-solid fa-user"></i> <span id="player-black">Đen: ---</span></span>
                            </div>

                            <!-- Bàn cờ HTML Grid -->
                            <div id="custom-chess-board" class="chess-grid ${currentBoardTheme}"></div>
                            
                            <div class="mt-4 text-xs font-semibold text-slate-400" id="your-role-badge">Đang chơi ở chế độ: <strong class="text-cyan-400">Luyện tập (Offline)</strong></div>
                            <button onclick="resetChessGame()" class="mt-3 px-6 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 text-xs font-bold transition"><i class="fa-solid fa-rotate-right mr-1"></i> Đặt Bàn Cờ Mới</button>
                        </div>

                        <div class="glass-card p-6 rounded-3xl border border-slate-800 space-y-6">
                            <h3 class="font-bold text-base text-white border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-sliders text-amber-400"></i> Cài Đặt Màu Bàn Cờ</h3>
                            <div>
                                <div class="grid grid-cols-2 gap-2.5 text-xs">
                                    <button onclick="changeBoardTheme('theme-neon')" class="p-3 rounded-xl bg-slate-900 border border-cyan-500/50 text-cyan-300 font-bold hover:bg-slate-800 transition">Neon EduSpace</button>
                                    <button onclick="changeBoardTheme('theme-wood')" class="p-3 rounded-xl bg-amber-950/40 border border-amber-600/40 text-amber-300 font-bold hover:bg-slate-800 transition">Gỗ Cổ Điển</button>
                                    <button onclick="changeBoardTheme('theme-emerald')" class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 font-bold hover:bg-slate-800 transition">Lục Bảo</button>
                                    <button onclick="changeBoardTheme('theme-purple')" class="p-3 rounded-xl bg-purple-950/40 border border-purple-500/40 text-purple-300 font-bold hover:bg-slate-800 transition">Tím Midnight</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderUserDropdown() {
            const selectEl = document.getElementById('invite-user-select');
            if (!selectEl) return;
            const users = Object.keys(globalUsers).map(k => globalUsers[k].name || k);
            let html = `<option value="">-- Chọn Bạn Bè Để Mời --</option>`;
            users.forEach(u => { if (u !== currentAuthUser) html += `<option value="${u}">${u}</option>`; });
            selectEl.innerHTML = html;
        }

        function changeBoardTheme(themeClass) {
            currentBoardTheme = themeClass;
            const boardEl = document.getElementById('custom-chess-board');
            if (boardEl) boardEl.className = `chess-grid ${themeClass}`;
        }

        function initCustomChessBoard() {
            renderUserDropdown();
            chessGame.reset();
            selectedSquare = null;
            validMoves = [];

            if (router.params.gameId) {
                activeGameId = router.params.gameId;
                myColor = router.params.color || 'w';

                const badge = document.getElementById('your-role-badge');
                if (badge) {
                    const colorStr = myColor === 'w' ? 'Quân Trắng' : 'Quân Đen';
                    badge.innerHTML = `Bạn đang cầm quân: <strong class="text-amber-400">${colorStr}</strong> | Đối thủ: <strong class="text-cyan-400">${router.params.opponent || 'Bạn bè'}</strong>`;
                }

                db.ref(`eduspace_chess_games/${activeGameId}`).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;
                    document.getElementById('player-white').innerText = `Trắng: ${data.white}`;
                    document.getElementById('player-black').innerText = `Đen: ${data.black}`;
                    
                    if (data.white === currentAuthUser) myColor = 'w';
                    else if (data.black === currentAuthUser) myColor = 'b';

                    if (data.fen) {
                        chessGame.load(data.fen);
                        drawChessGrid();
                    }
                    updateGameStatusUI();
                });
            } else {
                activeGameId = null;
                myColor = 'all'; // Offline luyện tập
                drawChessGrid();
                updateGameStatusUI();
            }
        }

        function resetChessGame() {
            chessGame.reset();
            selectedSquare = null;
            validMoves = [];
            drawChessGrid();
            updateGameStatusUI();
            if (activeGameId) {
                db.ref(`eduspace_chess_games/${activeGameId}`).update({ fen: chessGame.fen() });
            }
        }

        function updateGameStatusUI() {
            const statusEl = document.getElementById('game-status');
            if (!statusEl) return;

            if (chessGame.in_checkmate()) {
                const winner = chessGame.turn() === 'w' ? 'Đen' : 'Trắng';
                statusEl.innerText = `CHIẾU HẾT! Quân ${winner} THẮNG!`;
                statusEl.className = "px-4 py-1.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs font-bold animate-pulse";
                showModal("KẾT QUẢ VÁN ĐẤU", `Chiếu hết! Quân ${winner} đã giành chiến thắng!`, true);
            } else if (chessGame.in_draw()) {
                statusEl.innerText = "VÁN ĐẤU HÒA!";
                statusEl.className = "px-4 py-1.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold";
            } else {
                const turnStr = chessGame.turn() === 'w' ? 'Trắng' : 'Đen';
                const isMyTurn = (myColor === 'all') || (chessGame.turn() === myColor);
                const turnNotice = isMyTurn ? ' (ĐẾN LƯỢT BẠN!)' : ' (Chờ đối thủ...)';
                const inCheck = chessGame.in_check() ? ' - BỊ CHIẾU!' : '';

                statusEl.innerText = `Lượt: ${turnStr}${turnNotice}${inCheck}`;
                statusEl.className = isMyTurn ? "px-4 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold animate-pulse" : "px-4 py-1.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 text-xs font-bold shadow-neon";
            }
        }

        function drawChessGrid() {
            const boardContainer = document.getElementById('custom-chess-board');
            if (!boardContainer) return;

            const boardArr = chessGame.board();
            let html = '';

            // Xoay bàn cờ nếu là quân Đen
            const isBlackView = myColor === 'b';
            const rowStart = isBlackView ? 7 : 0;
            const rowEnd = isBlackView ? -1 : 8;
            const rowStep = isBlackView ? -1 : 1;

            const colStart = isBlackView ? 7 : 0;
            const colEnd = isBlackView ? -1 : 8;
            const colStep = isBlackView ? -1 : 1;

            for (let r = rowStart; r !== rowEnd; r += rowStep) {
                for (let c = colStart; c !== colEnd; c += colStep) {
                    const isWhiteSq = (r + c) % 2 === 0;
                    const sqClass = isWhiteSq ? 'sq-white' : 'sq-black';
                    const pieceObj = boardArr[r][c];
                    
                    let pieceChar = '';
                    if (pieceObj) {
                        const key = pieceObj.color === 'w' ? pieceObj.type.toUpperCase() : pieceObj.type.toLowerCase();
                        pieceChar = chessPiecesMap[key] || '';
                    }

                    const algSquare = String.fromCharCode(97 + c) + (8 - r);
                    const isSel = selectedSquare === algSquare ? 'selected' : '';
                    const isValid = validMoves.includes(algSquare) ? 'valid-move' : '';

                    html += `<div onclick="handleSquareClick('${algSquare}')" class="chess-square ${sqClass} ${isSel} ${isValid}">${pieceChar}</div>`;
                }
            }
            boardContainer.innerHTML = html;
        }

        function handleSquareClick(sq) {
            if (chessGame.game_over()) return;

            // KIỂM TRA LƯỢT ĐI MULTIPLAYER:
            if (myColor !== 'all' && chessGame.turn() !== myColor) {
                showModal("Chờ Lượt", "Chưa tới lượt của bạn!", false);
                return;
            }

            if (!selectedSquare) {
                const piece = chessGame.get(sq);
                if (piece && piece.color === chessGame.turn()) {
                    selectedSquare = sq;
                    const moves = chessGame.moves({ square: sq, verbose: true });
                    validMoves = moves.map(m => m.to);
                    drawChessGrid();
                }
            } else {
                const move = chessGame.move({
                    from: selectedSquare,
                    to: sq,
                    promotion: 'q'
                });

                selectedSquare = null;
                validMoves = [];

                if (move !== null && activeGameId) {
                    db.ref(`eduspace_chess_games/${activeGameId}`).update({ fen: chessGame.fen() });
                }

                drawChessGrid();
                updateGameStatusUI();
            }
        }

        function renderUploadPortal(data) {
            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fadeIn">
                    <div class="glass-card p-8 rounded-3xl border border-cyan-500/30 shadow-neon">
                        <h2 class="text-2xl font-extrabold text-white">Quản Lý & Đăng Bài Tập Cloud</h2>
                    </div>
                    <form onsubmit="handleFinalUpload(event)" class="glass-card p-8 sm:p-10 rounded-3xl border border-slate-800 space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-200 mb-2">Chọn Môn Học</label>
                            <select id="upload-subject" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3.5 text-slate-200">
                                ${Object.values(data).map(sub => `<option value="${sub.id}">${sub.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-200 mb-2">Tên Unit</label>
                            <input type="text" id="upload-unit-title" required placeholder="Ví dụ: Unit 2: Tích Phân" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3.5 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-200 mb-2">Tên Bài Học</label>
                            <input type="text" id="upload-lesson-title" required placeholder="Ví dụ: Lesson 1: Ứng dụng tích phân" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3.5 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-200 mb-2">Nội Dung Lý Thuyết ($...$)</label>
                            <textarea id="upload-theory" rows="3" required placeholder="<h3>1. Lý thuyết...</h3>" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-slate-200 font-mono text-sm"></textarea>
                        </div>
                        <div class="pt-4 flex justify-end">
                            <button type="submit" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-neon-lg">Đăng Bài Lên Đám Mây</button>
                        </div>
                    </form>
                </div>`;
        }

        function handleFinalUpload(e) {
            e.preventDefault();
            const subjectId = document.getElementById('upload-subject').value;
            const unitTitle = document.getElementById('upload-unit-title').value.trim();
            const lessonTitle = document.getElementById('upload-lesson-title').value.trim();
            const theory = document.getElementById('upload-theory').value;

            let data = globalData;
            let sub = data[subjectId];
            if (!sub.units) sub.units = [];
            let unit = sub.units.find(u => u.title.toLowerCase() === unitTitle.toLowerCase());
            if (!unit) {
                unit = { id: subjectId + '_u_' + Date.now(), title: unitTitle, lessons: [] };
                sub.units.push(unit);
            }
            if (!unit.lessons) unit.lessons = [];

            unit.lessons.push({
                id: subjectId + '_l_' + Date.now(),
                title: lessonTitle,
                theory: theory,
                exercises: [{ question: 'Câu hỏi mặc định?', options: ['A', 'B', 'C', 'D'], correct: 0, explanation: 'Mẫu.' }],
                essays: []
            });

            saveAppData(data);
            showModal("Hoàn Tất", "Đã đăng bài học lên Firebase Cloud!", true);
            setTimeout(() => { closeModal(); router.navigate('subject', {subjectId: subjectId}); }, 1500);
        }

        function renderContact() {
            return `<div class="max-w-2xl mx-auto text-center glass-card p-10 rounded-3xl border border-cyan-500/30 space-y-4"><h2 class="text-3xl font-bold text-white">Hỗ Trợ 24/7</h2><p class="text-slate-300">SĐT: 0981128536 | Email: hoangphihung2k11@gmail.com</p></div>`;
        }

        window.onload = function() {
            initFirebaseListeners();
            router.navigate('home');
        };
    </script>
